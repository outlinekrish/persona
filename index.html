<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Krish's Website</title>
  <meta name="description" content="Official page to learn about and purchase Persona." />
  <link rel="canonical" href="https://outlinekrish.github.io/persona" />

  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="Persona — Official" />
  <meta property="og:description" content="Official page to learn about and purchase Persona." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://outlinekrish.github.io/persona" />
  <!-- External image used for social preview (provided by user) -->
  <meta property="og:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSc1bI7YGOMX2t22Y9ksFEoRnmBHRHNMhfEd8i6bKLZpQ&s=10" />

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Persona — Official" />
  <meta name="twitter:description" content="Official page to learn about and purchase Persona." />
  <meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSc1bI7YGOMX2t22Y9ksFEoRnmBHRHNMhfEd8i6bKLZpQ&s=10" />

  <meta name="theme-color" content="#0066cc" />
  <!-- Optional: <link rel="manifest" href="/site.webmanifest"> -->

  <link rel="icon" href="/favicon.ico" />

  <!-- Minimal CSS - move to styles.css in production -->
  <style>
    :root {
      --bg: #fff;
      --fg: #111;
      --muted: #444;
      --accent: #0066cc;
      --accent-contrast: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      color-scheme: light;
      color: var(--fg);
      background: var(--bg);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #081018; --fg: #eef6ff; --muted: #9aa8b6; }
    }
    html,body { height: 100%; }
    body { margin: 0; padding: 1rem; line-height: 1.5; }
    header, main, footer { max-width: 900px; margin: 0 auto; }
    header { padding: 1rem 0; }
    h1 { font-size: 1.75rem; margin: 0 0 .5rem; }
    .hero { display: grid; grid-template-columns: 1fr; gap: 1rem; align-items: start; }
    figure { margin: 0; }
    img { max-width: 100%; height: auto; display: block; border-radius: 6px; }
    .cta { display: inline-block; background: var(--accent); color: var(--accent-contrast); padding: .6rem 1rem; text-decoration: none; border-radius: 6px; }
    .cta:focus { outline: 3px solid #ffbf47; outline-offset: 2px; }
    footer { margin-top: 2rem; font-size: .9rem; color: var(--muted); padding-bottom: 2rem; }

    /* Accessibility helpers */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    /* Visible skip link on focus */
    .skip-link {
      position: absolute;
      left: 1rem;
      top: 1rem;
      background: #000;
      color: #fff;
      padding: .35rem .6rem;
      border-radius: 4px;
      transform: translateY(-120%);
      transition: transform 150ms ease-in-out;
      z-index: 999;
    }
    .skip-link:focus {
      transform: translateY(0);
    }

    /* Responsive adjustments for larger screens */
    @media (min-width: 700px) {
      .hero { grid-template-columns: 1fr 360px; }
    }
  </style>
</head>
<body>
  <!-- Skip link: hidden visually until keyboard focus -->
  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <h1>Persona</h1>
    <p>Discover Persona — an immersive game experience.</p>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="hero-heading">
      <!-- Hidden heading for screen readers -->
      <h2 id="hero-heading" class="sr-only">Persona — Buy and Learn</h2>

      <figure>
        <!-- Use an externally hosted image (this avoids adding images to the repo). -->
        <!-- Using the URL you provided. -->
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSc1bI7YGOMX2t22Y9ksFEoRnmBHRHNMhfEd8i6bKLZpQ&s=10"
          alt="Persona cover art (external image)"
          loading="lazy"
          width="1200"
          height="675"
        />
        <figcaption>Persona — cover art</figcaption>
      </figure>

      <div>
        <h3>Get the game</h3>
        <p>Ready to buy? Visit the official store to purchase Persona and learn more about editions and platforms.</p>
        <p>
          <a class="cta" href="https://persona.atlus.com/" target="_blank" rel="noopener noreferrer" role="button">Buy Persona</a>
        </p>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Persona. All rights reserved.</p>
    <p style="margin-top:.25rem;color:var(--muted);font-size:.85rem">Built by <a href="https://github.com/outlinekrish" rel="noopener noreferrer">outlinekrish</a></p>

    <script>
      // Small script to set current year
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </footer>
</body>
</html>
